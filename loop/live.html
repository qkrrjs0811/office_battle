<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회사 전투 게임 · 라이브</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --panel: #ffffff;
        --ink: #23262b;
        --dim: #6b7078;
        --line: #dfdcd4;
        --run: #1f8a4c;
        --wait: #b7791f;
        --off: #8a8f97;
        --device: #1d1f23;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171a;
          --panel: #1f2226;
          --ink: #eceef1;
          --dim: #a0a6ae;
          --line: #33373d;
          --device: #000;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif; }
      main { display: flex; gap: 20px; padding: 16px; height: 100vh; }
      #stage { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #device { background: var(--device); border-radius: 26px; padding: 10px; }
      #frameBox { overflow: hidden; border-radius: 16px; background: #fff; }
      iframe { display: block; width: 390px; height: 844px; border: 0; transform-origin: 0 0; }
      button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
      #side { flex: 1; min-width: 0; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
      h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--dim); }
      #status { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
      #dot.running { background: var(--run); }
      #dot.waiting, #dot.stopping { background: var(--wait); }
      #notice { margin-top: 6px; color: var(--wait); }
      ul { margin: 0; padding: 0; list-style: none; }
      li { overflow-wrap: anywhere; padding: 2px 0; }
      #activity li { font: 12px/1.5 ui-monospace, Consolas, monospace; }
      pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
      #shots { display: flex; gap: 10px; overflow-x: auto; }
      #shots a { flex: none; color: var(--dim); font-size: 12px; text-decoration: none; }
      #shots img { display: block; height: 180px; border: 1px solid var(--line); border-radius: 6px; }
      .empty { color: var(--dim); }
      @media (max-width: 860px) {
        main { flex-direction: column; height: auto; }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <div id="device"><div id="frameBox"><iframe id="game" src="__GAME_URL__" title="게임 화면"></iframe></div></div>
        <button id="reload" type="button">게임 다시 시작</button>
      </div>
      <div id="side">
        <section>
          <div id="status"><span id="dot"></span><span id="statusText">불러오는 중</span></div>
          <div id="notice" hidden></div>
        </section>
        <section><h2 id="todoTitle">지금 할 일</h2><div id="todo"></div></section>
        <section><h2>AI가 방금 한 일</h2><ul id="activity"></ul></section>
        <section><h2>최근 커밋</h2><ul id="commits"></ul></section>
        <section><h2>최근 기록</h2><pre id="record"></pre></section>
        <section><h2>검사 스크린샷</h2><div id="shots"></div></section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const frame = $('game')
      const box = $('frameBox')

      // 창 높이에 맞춰 폰 화면을 줄인다. 게임 안에서는 항상 390×844 그대로다
      function fit() {
        const narrow = window.innerWidth <= 860
        const room = narrow ? 844 : window.innerHeight - 92
        const scale = Math.min(1, room / 844)
        frame.style.transform = `scale(${scale})`
        box.style.width = `${390 * scale}px`
        box.style.height = `${844 * scale}px`
      }
      window.addEventListener('resize', fit)
      fit()
      $('reload').addEventListener('click', () => { frame.src = frame.src })

      function fillList(el, items, emptyText) {
        el.replaceChildren(...(items.length ? items : [emptyText]).map((text) => {
          const li = document.createElement('li')
          li.textContent = text
          if (!items.length) li.className = 'empty'
          return li
        }))
      }

      function fillShots(shots) {
        $('shots').replaceChildren(...shots.map(({ name, at }) => {
          const a = document.createElement('a')
          a.href = `/shots/${encodeURIComponent(name)}?t=${at}`
          a.target = '_blank'
          const img = document.createElement('img')
          img.src = a.href
          img.alt = name
          a.append(img, name)
          return a
        }))
        if (!shots.length) $('shots').textContent = '아직 없음'
      }

      let shotsKey = ''
      async function refresh() {
        let s
        try {
          s = await (await fetch('/api/state')).json()
        } catch {
          $('statusText').textContent = '라이브 서버 연결 끊김'
          $('dot').className = ''
          return
        }
        $('dot').className = s.loop.phase
        $('statusText').textContent = s.loop.label + (s.until ? ` · ${new Date(s.until).toLocaleTimeString('ko-KR')}까지` : '')
        $('notice').hidden = !s.waitingForUser
        $('notice').textContent = '직접 해 보고 판단할 차례입니다. 피드백.md에 적거나 기획서.md를 고치면 다시 돕니다.'
        $('todoTitle').textContent = `지금 할 일 (${s.todo.done}/${s.todo.total} 완료)`
        $('todo').textContent = s.todo.current ?? '남은 항목 없음'
        fillList($('activity'), s.activity, '아직 없음')
        fillList($('commits'), s.commits, '아직 없음')
        $('record').textContent = s.record
        const key = JSON.stringify(s.shots)
        if (key !== shotsKey) {
          shotsKey = key
          fillShots(s.shots)
        }
      }
      refresh()
      setInterval(refresh, 2000)
    </script>
  </body>
</html>
