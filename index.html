<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>회사 전투 게임</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2f3640;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: min(100vw, calc(100dvh * 390 / 844));
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
      }
      canvas {
        touch-action: none;
      }
      .profile {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 196px;
        box-sizing: border-box;
        padding: 6px 10px 6px 6px;
        border: 2px solid #c9d2db;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 13px/1.2 sans-serif;
        pointer-events: none;
      }
      .profile-portrait {
        flex: none;
        width: 60px;
        height: 68px;
        border-radius: 8px;
        background: #e6ebf0;
      }
      .profile-details {
        flex: 1;
        min-width: 0;
      }
      .profile-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .profile-rank {
        font-size: 16px;
      }
      .profile-level {
        color: #f5d76e;
      }
      .gauge {
        position: relative;
        height: 18px;
        margin-top: 3px;
        border-radius: 5px;
        background: #171b21;
        overflow: hidden;
      }
      .gauge-fill {
        height: 100%;
      }
      .gauge-hp .gauge-fill {
        background: #d8453e;
      }
      .gauge-mp .gauge-fill {
        background: #3f7fd1;
      }
      .gauge-text {
        position: absolute;
        inset: 0;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
      }
      .gauge-xp .gauge-fill {
        background: #4f9d5d;
      }
      .corner {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
      }
      .wallet {
        display: flex;
        gap: 4px;
      }
      .wallet-chip {
        padding: 4px 8px;
        border-radius: 8px;
        background: #2f3640;
        color: #f5d76e;
        font: 700 13px/1.2 sans-serif;
        white-space: nowrap;
      }
      .menu-bar {
        position: absolute;
        /* 맨 아래 띠는 맵을 끄는 빈 곳으로 남긴다 */
        bottom: 60px;
        left: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .menu-button {
        position: relative;
        flex: 1;
        min-height: 50px;
        border: 3px solid #c9d2db;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 16px/1 sans-serif;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
      .menu-badge {
        position: absolute;
        top: -8px;
        right: -4px;
        min-width: 22px;
        height: 22px;
        padding: 0 4px;
        box-sizing: border-box;
        border-radius: 11px;
        background: #d8453e;
        font-size: 13px;
        line-height: 22px;
      }
      .menu-badge[hidden] {
        display: none;
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 66%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 16px 16px 0 0;
        background: #f4f1e8;
        color: #2f3640;
        font: 13px/1.35 sans-serif;
      }
      .sheet[hidden] {
        display: none;
      }
      .sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sheet-title {
        font-size: 20px;
        font-weight: 700;
      }
      .sheet-close,
      .row-action {
        flex: none;
        min-width: 76px;
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 14px/1 sans-serif;
        cursor: pointer;
      }
      .row-action:disabled {
        background: #c9d2db;
        color: #5c6670;
        cursor: default;
      }
      .sheet-summary {
        margin: 8px 0;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .sheet-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        touch-action: pan-y;
      }
      .menu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #fff;
      }
      .menu-row.quest-done {
        outline: 3px solid #f5b83d;
      }
      .menu-row.quest-claimed {
        opacity: 0.55;
      }
      .row-text {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        font-size: 15px;
        font-weight: 700;
      }
      .row-state {
        flex: none;
        min-width: 44px;
        text-align: center;
        font-weight: 700;
      }
      .map-name {
        max-width: 164px;
        box-sizing: border-box;
        padding: 6px 12px;
        border-radius: 8px;
        background: #fff;
        color: #2f3640;
        font: 700 15px/1.3 sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      .portal-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .portal-sign {
        position: absolute;
        transform: translate(-50%, -50%);
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 3px solid;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 14px/1 sans-serif;
        white-space: nowrap;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
