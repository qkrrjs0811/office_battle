<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>회사 전투 게임</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2f3640;
        overflow: hidden;
      }
      #app {
        /* 안쪽 배치는 언제나 이 크기다. 창에 맞추는 배율은 fitStage가 넣는다 */
        position: absolute;
        top: 50%;
        left: 50%;
        width: 390px;
        height: 844px;
        transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
        overflow: hidden;
      }
      canvas {
        touch-action: none;
      }
      .profile {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 196px;
        box-sizing: border-box;
        padding: 6px 10px 6px 6px;
        border: 2px solid #c9d2db;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 13px/1.2 sans-serif;
        pointer-events: none;
      }
      .profile-portrait {
        flex: none;
        width: 60px;
        height: 68px;
        border-radius: 8px;
        background: #e6ebf0;
      }
      .profile-details {
        flex: 1;
        min-width: 0;
      }
      .profile-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .profile-rank {
        font-size: 16px;
      }
      .profile-level {
        color: #f5d76e;
      }
      .gauge {
        position: relative;
        height: 18px;
        margin-top: 3px;
        border-radius: 5px;
        background: #171b21;
        overflow: hidden;
      }
      .gauge-fill {
        height: 100%;
      }
      .gauge-hp .gauge-fill {
        background: #d8453e;
      }
      .gauge-mp .gauge-fill {
        background: #3f7fd1;
      }
      .gauge-text {
        position: absolute;
        inset: 0;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
      }
      .gauge-xp .gauge-fill {
        background: #4f9d5d;
      }
      .corner {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
      }
      .wallet {
        display: flex;
        gap: 4px;
      }
      .wallet-chip {
        padding: 4px 8px;
        border-radius: 8px;
        background: #2f3640;
        color: #f5d76e;
        font: 700 13px/1.2 sans-serif;
        white-space: nowrap;
      }
      .menu-bar {
        /* 맵은 폭에 맞춰 줄어들어 화면 위아래가 비어 있다 */
        position: absolute;
        bottom: 14px;
        left: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .menu-button {
        position: relative;
        flex: 1;
        min-height: 50px;
        border: 3px solid #c9d2db;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 16px/1 sans-serif;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
      .menu-badge {
        position: absolute;
        top: -8px;
        right: -4px;
        min-width: 22px;
        height: 22px;
        padding: 0 4px;
        box-sizing: border-box;
        border-radius: 11px;
        background: #d8453e;
        font-size: 13px;
        line-height: 22px;
      }
      .menu-badge[hidden] {
        display: none;
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 66%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 16px 16px 0 0;
        background: #f4f1e8;
        color: #2f3640;
        font: 13px/1.35 sans-serif;
      }
      .sheet[hidden] {
        display: none;
      }
      .sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sheet-title {
        font-size: 20px;
        font-weight: 700;
      }
      .sheet-close,
      .row-action {
        flex: none;
        min-width: 76px;
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 14px/1 sans-serif;
        cursor: pointer;
      }
      .row-action:disabled {
        background: #c9d2db;
        color: #5c6670;
        cursor: default;
      }
      .sheet-summary {
        margin: 8px 0;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .sheet-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        touch-action: pan-y;
      }
      .menu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #fff;
      }
      .menu-row.quest-done {
        /* 목록 가장자리에서 잘리지 않게 칸 안쪽에 그린다 */
        box-shadow: inset 0 0 0 3px #f5b83d;
      }
      .menu-row.quest-claimed {
        opacity: 0.55;
      }
      .row-text {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        font-size: 15px;
        font-weight: 700;
      }
      .row-state {
        flex: none;
        min-width: 44px;
        text-align: center;
        font-weight: 700;
      }
      .map-name {
        max-width: 164px;
        box-sizing: border-box;
        padding: 6px 12px;
        border-radius: 8px;
        background: #fff;
        color: #2f3640;
        font: 700 15px/1.3 sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      .menu-fight {
        flex: 1.3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border-color: #f5d76e;
        background: #d8453e;
      }
      .menu-fight:disabled {
        border-color: #c9d2db;
        background: #5c6670;
        cursor: default;
      }
      .menu-fight-note {
        font-size: 12px;
        white-space: nowrap;
      }
      #app[data-mode='fight'] .portal-layer,
      #app[data-mode='fight'] .profile,
      #app[data-mode='fight'] .corner,
      #app[data-mode='fight'] .menu-bar,
      #app[data-mode='fight'] .sheet {
        display: none;
      }
      .fight,
      .fight-stage,
      .fight-result {
        position: absolute;
        inset: 0;
      }
      .fight[hidden],
      .fight-result[hidden],
      .fight-warning[hidden] {
        display: none;
      }
      .fight {
        color: #fff;
        font: 700 14px/1.3 sans-serif;
      }
      .fight-stage {
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }
      .fight-top,
      .fight-bottom {
        position: absolute;
        left: 10px;
        right: 10px;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid #c9d2db;
        border-radius: 12px;
        background: #2f3640;
        pointer-events: none;
      }
      .fight-top {
        top: 10px;
      }
      .fight-bottom {
        bottom: 16px;
      }
      .fight-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 16px;
      }
      .fight-kind {
        padding: 2px 8px;
        border-radius: 6px;
        background: #5c6670;
        font-size: 13px;
      }
      .fight-kind.boss {
        background: #d8453e;
      }
      .fight-hp .gauge-fill {
        background: #d8453e;
      }
      .fight-warning {
        position: absolute;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 10px;
        background: #d8453e;
        font-size: 18px;
        white-space: nowrap;
        pointer-events: none;
      }
      .fight-skills {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .fight-skill {
        position: relative;
        flex: 1;
        min-height: 56px;
        padding: 0;
        border: 2px solid #5c6670;
        border-radius: 10px;
        background: #171b21;
        color: #fff;
        font: inherit;
        overflow: hidden;
      }
      .fight-skill.ready {
        border-color: #f5d76e;
      }
      .fight-skill.active {
        border-color: #fff;
      }
      button.fight-skill {
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
      .fight-skill-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: #3f7fd1;
      }
      .fight-skill-text {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 52px;
      }
      .fight-skill-how {
        color: #f5d76e;
        font-size: 12px;
      }
      .fight-skill-name {
        font-size: 13px;
        white-space: nowrap;
      }
      .fight-result {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(23, 27, 33, 0.55);
      }
      .fight-result-panel {
        width: 300px;
        padding: 20px;
        box-sizing: border-box;
        border-radius: 16px;
        background: #f4f1e8;
        color: #2f3640;
        text-align: center;
      }
      .fight-result-title {
        font-size: 28px;
        font-weight: 900;
      }
      .fight-result-lines {
        margin: 12px 0 16px;
        font-size: 14px;
      }
      .fight-result-line {
        margin-top: 4px;
      }
      .fight-result-close {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 16px/1 sans-serif;
        cursor: pointer;
        touch-action: none;
      }
      .portal-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .portal-sign {
        position: absolute;
        transform: translate(-50%, -50%);
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 3px solid;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 14px/1 sans-serif;
        white-space: nowrap;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
