<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>회사 전투 게임</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2f3640;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: min(100vw, calc(100dvh * 390 / 844));
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
      }
      canvas {
        touch-action: none;
      }
      .floor-label {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 6px;
        background: #2f3640;
        color: #fff;
        font: 700 18px/1.3 sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      .map-name {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        border-radius: 6px;
        background: #fff;
        color: #2f3640;
        font: 700 15px/1.3 sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      .portal-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .portal-sign {
        position: absolute;
        transform: translate(-50%, -50%);
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 3px solid;
        border-radius: 10px;
        background: #2f3640;
        color: #fff;
        font: 700 14px/1 sans-serif;
        white-space: nowrap;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
